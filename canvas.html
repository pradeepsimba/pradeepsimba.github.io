
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="12.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <title>Canvas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        button {
            padding: 12px 20px;
            background: #37474f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #546e7a;
        }

        #clearButton {
            background: #d32f2f;
        }

        #drawingCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #121212;
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>

<body>

    <div class="controls">
        <button id="maximizeButton">Fullscreen</button>
        <button id="clearButton">C</button>
    </div>

    <canvas id="drawingCanvas"></canvas>

    <script>
        const canvas = document.getElementById("drawingCanvas");
        const ctx = canvas.getContext("2d");

        const maximizeButton = document.getElementById("maximizeButton");
        const clearButton = document.getElementById("clearButton");

        // Brush settings
        const BRUSH_COLOR = "#ffffff";
        const BRUSH_SIZE = 3;

        let drawing = false;
        let lastX = 0;
        let lastY = 0;

        // Configure brush
        function configureBrush() {
            ctx.lineWidth = BRUSH_SIZE;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = BRUSH_COLOR;
            ctx.fillStyle = BRUSH_COLOR;
        }

        // Resize canvas and preserve existing drawing
        function resizeCanvas() {

            const oldWidth = canvas.width;
            const oldHeight = canvas.height;

            const newWidth = window.innerWidth;
            const newHeight = window.innerHeight;

            if (oldWidth === newWidth && oldHeight === newHeight) {
                return;
            }

            // Save existing drawing
            const imageData = ctx.getImageData(
                0, 0, oldWidth, oldHeight
            );

            // Resize
            canvas.width = newWidth;
            canvas.height = newHeight;

            // Restore brush settings
            configureBrush();

            // Restore drawing
            ctx.putImageData(imageData, 0, 0);
        }

        // Initial setup
        function initializeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            configureBrush();
        }

        initializeCanvas();

        window.addEventListener("resize", resizeCanvas);

        // Get pointer coordinates
        function getCoordinates(event) {
            const rect = canvas.getBoundingClientRect();

            return {
                x: (event.clientX - rect.left) * (canvas.width / rect.width),
                y: (event.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // Draw dot
        function drawDot(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, BRUSH_SIZE / 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Start drawing
        canvas.addEventListener("pointerdown", (event) => {

            event.preventDefault();

            drawing = true;

            canvas.setPointerCapture(event.pointerId);

            const point = getCoordinates(event);

            lastX = point.x;
            lastY = point.y;

            drawDot(lastX, lastY);
        });

        // Continue drawing
        canvas.addEventListener("pointermove", (event) => {

            if (!drawing) return;

            event.preventDefault();

            const point = getCoordinates(event);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(point.x, point.y);
            ctx.stroke();

            lastX = point.x;
            lastY = point.y;
        });

        // Stop drawing
        function stopDrawing() {
            drawing = false;
        }

        canvas.addEventListener("pointerup", stopDrawing);
        canvas.addEventListener("pointercancel", stopDrawing);
        canvas.addEventListener("lostpointercapture", stopDrawing);

        // Fullscreen
        maximizeButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.error("Fullscreen error:", error);
            }
        });

        // Fullscreen change
        document.addEventListener("fullscreenchange", () => {

            maximizeButton.style.display =
                document.fullscreenElement ? "none" : "block";

            resizeCanvas();
        });

        // Clear canvas
        clearButton.addEventListener("click", () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Service worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("Service Worker registered"))
                .catch(error => console.error(error));
        }

    </script>

</body>
</html>
