
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="12.png" type="image/icon type">
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #121212;
            color: #f0f0f0;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        button {
            padding: 12px 20px;
            background: #37474f;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #546e7a;
        }

        #clearButton {
            background: #d32f2f;
        }

        #clearButton:hover {
            background: #f44336;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #121212;
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>

<body>

<div class="controls">
    <button id="maximizeButton">Fullscreen</button>
    <button id="clearButton">C</button>
</div>

<canvas id="drawingCanvas"></canvas>

<script>
const canvas = document.getElementById("drawingCanvas");
const ctx = canvas.getContext("2d");

const maximizeButton = document.getElementById("maximizeButton");
const clearButton = document.getElementById("clearButton");

// Brush settings
const BRUSH_COLOR = "#ffffff";
const BRUSH_SIZE = 3;

let drawing = false;
let lastX = 0;
let lastY = 0;

// Configure drawing context
function configureContext() {
    ctx.lineWidth = BRUSH_SIZE;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = BRUSH_COLOR;
    ctx.fillStyle = BRUSH_COLOR;
}

// Resize canvas while preserving existing drawing
function resizeCanvas() {

    // Save existing drawing
    const imageData = ctx.getImageData(
        0, 0,
        canvas.width,
        canvas.height
    );

    const oldWidth = canvas.width;
    const oldHeight = canvas.height;

    // Get new dimensions
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;

    // Resize canvas only when necessary
    if (oldWidth === newWidth && oldHeight === newHeight) {
        return;
    }

    canvas.width = newWidth;
    canvas.height = newHeight;

    // Restore brush settings after canvas resize
    configureContext();

    // Restore existing drawing
    ctx.putImageData(imageData, 0, 0);
}

// Initial canvas setup
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
configureContext();

window.addEventListener("resize", resizeCanvas);

// Get mouse/touch coordinates
function getCoordinates(event) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

// Draw dot
function drawDot(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fill();
}

// Start drawing
function startDrawing(event) {

    event.preventDefault();

    drawing = true;

    const { x, y } = getCoordinates(event);

    lastX = x;
    lastY = y;

    drawDot(x, y);
}

// Stop drawing
function stopDrawing() {
    drawing = false;
}

// Draw
function draw(event) {

    if (!drawing) return;

    event.preventDefault();

    const { x, y } = getCoordinates(event);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();

    lastX = x;
    lastY = y;
}

// Mouse and touch support
canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseleave", stopDrawing);

canvas.addEventListener("touchstart", startDrawing, { passive: false });
canvas.addEventListener("touchmove", draw, { passive: false });
canvas.addEventListener("touchend", stopDrawing);
canvas.addEventListener("touchcancel", stopDrawing);

// Fullscreen
function handleFullscreenChange() {

    maximizeButton.style.display =
        document.fullscreenElement ? "none" : "block";

    // Resize and preserve drawing after fullscreen changes
    resizeCanvas();
}

maximizeButton.addEventListener("click", async () => {

    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error("Fullscreen error:", error);
    }

});

document.addEventListener("fullscreenchange", handleFullscreenChange);

// Clear canvas
clearButton.addEventListener("click", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// Service Worker
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch(error => console.error("Service Worker error:", error));
}

</script>

</body>
</html>
